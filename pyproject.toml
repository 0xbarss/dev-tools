[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devtools"
version = "0.1.0"
description = "A personal, installable developer toolkit for AI-assisted repository workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "You" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "orjson>=3.9",
    "platformdirs>=4.2",
    "tiktoken>=0.6; python_version >= '3.9'",
    "pathspec>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
devtools = "devtools.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]